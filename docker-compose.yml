# Local development only. Credentials here are throwaway local values, not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ipro
      POSTGRES_PASSWORD: ipro
      POSTGRES_DB: ipro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipro -d ipro']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local S3 stand-in for documents (decision #37). Throwaway local credentials in docker/seaweedfs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports:
      - '8333:8333'
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
  seaweeddata:
